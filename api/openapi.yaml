          description: Monitor priorities that must match for this rule to fire. An
            empty array matches every priority.
          items:
            enum:
            - 1
            - 2
            - 3
            - 4
            - 5
            type: number
          type: array
        transitionTypesFilter:
          description: Alert state transitions that must match for this rule to fire.
            An empty array matches every transition type.
          items:
            enum:
            - triggered
            - resolved
            - no-data
            type: string
          type: array
        clusterIdsFilter:
          description: "Cluster IDs that must match for this rule to fire. An empty\
            \ array matches every cluster, as does a transition that has no cluster\
            \ ID."
          items:
            type: string
          type: array
        owner:
          description: Team ID that owns and manages the rule.
          type: string
        isActive:
          description: Whether the rule currently sends notifications when its filters
            match.
          type: boolean
        tags:
          description: Key/value tags applied to the resource. Use them to organize
            resources and to satisfy tag policies.
          items:
            $ref: "#/components/schemas/Tag_1"
          title: Tags
          type: array
        targets:
          description: "Destinations that receive a notification whenever this rule\
            \ matches an alert transition. Every target in the list is notified independently,\
            \ subject to its own rate limit and renotification settings."
          items:
            $ref: "#/components/schemas/Rule_targets_inner"
          type: array
      required:
      - clusterIdsFilter
      - id
      - isActive
      - name
      - owner
      - prioritiesFilter
      - targets
      - teamsFilter
      - transitionTypesFilter
