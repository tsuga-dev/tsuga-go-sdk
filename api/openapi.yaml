    Monitor:
      description: "Saved alert definition that evaluates telemetry and creates alert\
        \ transitions. Notification delivery is configured separately with notification\
        \ rules. See [Monitors](/documentation/alert/monitors/index)."
      example:
        id: 123-456-abc
        name: High Error Rate Alert
        message: Error rate exceeded threshold. Check the API gateway logs.
        tags:
        - key: severity
          value: critical
        configuration:
          type: log
          timeframe: 5
          groupByFields: []
          aggregationAlertLogic: no_aggregation
          queries:
          - aggregate:
              type: count
            filter: level:ERROR service:api-gateway
          conditions:
          - formula: q1
            operator: greater_than
            threshold: 100
          noDataBehavior: resolve
        priority: 1
        owner: team-123-abc
        dashboardId: 789-abc-def
        permissions: all
        clusterIds: []
      properties:
        id:
          description: Tsuga-generated monitor ID assigned when the monitor is created.
          type: string
        name:
          description: Display name of the monitor and alert source.
          type: string
        owner:
          description: Team ID that owns and manages the monitor.
          type: string
        message:
          description: Caller-supplied message included in notifications triggered
            by this monitor. Omitted when the monitor was created or last updated
            without one.
          type: string
        tags:
          description: Key/value tags applied to the resource. Use them to organize
            resources and to satisfy tag policies.
          items:
            $ref: "#/components/schemas/Tag_1"
          title: Tags
          type: array
        configuration:
          $ref: "#/components/schemas/Monitor_configuration"
        priority:
          description: "Monitor priority from 1 through 5, where 1 is highest priority."
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          type: number
        permissions:
          description: "`all` allows the resource to query all permitted telemetry,\
            \ `owning-team-and-public` limits it to the owning team plus public data,\
            \ and `owning-team-only` limits it to the owning team."
          enum:
          - all
          - owning-team-and-public
          - owning-team-only
          type: string
        dashboardId:
          description: ID of the dashboard linked to this monitor for context when
            investigating alerts. Caller-supplied. Omitted when no dashboard is linked.
          type: string
        clusterIds:
          description: Cluster IDs where the monitor is deployed. Empty means all
            eligible clusters.
          items:
            type: string
          type: array
      required:
      - clusterIds
      - configuration
      - id
      - name
      - owner
      - permissions
      - priority
