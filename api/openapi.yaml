            \ order. Limited to 15 items. For dataSource \"metrics\", each aggregate's\
            \ `field` is the metric name, not an attribute; to count distinct values\
            \ of an attribute use unique-count with field \"<metricName>.context.<attribute>\"\
            \ (e.g. \"system.cpu.utilization.context.host.name\")."
          items:
            $ref: "#/components/schemas/AggregationQuery_1"
          maxItems: 15
          type: array
        formula:
          description: "Formula referencing query outputs, such as `q1 + q2`, to compute\
            \ derived results. Defaults to `q1`. Formulas may reference only submitted\
            \ queries (`q1` through `qN`); undefined query references return 400."
          format: tsuga-formula
          maxLength: 250
          minLength: 0
          type: string
          errorMessage:
            format: "Must be a simple mathematical formula, and all variables in it\
              \ should refer to queries (q1, q2, etc.). The formula you provided is\
              \ invalid: ${0}"
