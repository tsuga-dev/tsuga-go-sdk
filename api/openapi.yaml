          description: "Nested grouping levels applied to aggregation results, outermost\
            \ first (e.g. group by service, then by level within each service). Each\
            \ level splits results further, so the response contains one result per\
            \ unique combination of group values instead of one aggregated total.\
            \ Defaults to an empty array (one ungrouped result) when omitted. Limited\
            \ to 7 levels."
