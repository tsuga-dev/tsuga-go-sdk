          renotifyConfig:
            mode: each
            renotificationStates:
            - alert
            renotifyIntervalMinutes: 30
          config:
            type: email
            addresses:
            - oncall@example.com
      properties:
        id:
          description: Tsuga-generated notification rule ID assigned when the rule
            is created.
          type: string
        name:
          description: Display name of the notification rule.
          type: string
        queryString:
          description: "Optional query that narrows which alert transitions trigger\
            \ the rule. Matches on the monitor transition group key and the monitor\
            \ tags, e.g. `env:prod service:api`. Omit or leave empty to match regardless\
            \ of tags."
          type: string
        teamsFilter:
          $ref: "#/components/schemas/Rule_teamsFilter"
