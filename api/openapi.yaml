    Dashboard:
      description: "Saved visualization made of dashboard-wide filters and ordered\
        \ graphs. Use dashboards to preserve reusable views for a team or workflow.\
        \ See [Dashboards](/documentation/visualize/dashboards/index)."
      example:
        id: 123-456-abc
        name: API Performance Overview
        owner: team-123-abc
        graphs:
        - id: 789-abc-def
          name: Request Latency P99
          visualization:
            type: timeseries
            source: metrics
            queries:
            - aggregate:
                type: percentile
                field: duration
                percentile: 99
              filter: service:api-gateway
          layout:
            x: 0
            "y": 0
            w: 6
            h: 4
        filters:
        - key: env
          values:
          - production
        tags:
        - key: team
          value: platform
        timePreset: past-1-hour
      properties:
        id:
          description: Tsuga-generated dashboard ID assigned when the dashboard is
            created.
          type: string
        name:
          description: Display name of the dashboard. Set by the caller on create
            or update.
          type: string
        owner:
          description: ID of the team that owns the dashboard. Set by the caller on
            create or update and used for dashboard access control.
          type: string
        graphs:
          description: Ordered widgets that compose the dashboard
          items:
            $ref: "#/components/schemas/Graph_1"
          type: array
        filters:
          description: Dashboard-wide filters applied to every widget on the dashboard.
          items:
