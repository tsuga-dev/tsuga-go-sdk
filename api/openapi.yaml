    InputMonitorConfigurationAnomalyTrace:
      properties:
        type:
          description: Anomaly monitor over trace aggregations.
          enum:
          - anomaly-trace
          type: string
        condition:
          $ref: "#/components/schemas/InputMonitorConfigurationAnomalyLog_condition"
        noDataBehavior:
          description: "How the anomaly monitor updates state when no data is returned.\
            \ `alert` enters no-data alert state, `resolve` resolves, and `keep_last_status`\
            \ preserves the previous state."
          enum:
          - alert
          - resolve
          - keep_last_status
          type: string
        timeframe:
          description: "Lookback window, in minutes, that each anomaly monitor evaluation\
            \ aggregates over. Valid input is 5 through 1440 minutes."
          maximum: 1440
          minimum: 5
          type: number
        groupByFields:
          description: Monitor group by configuration. Warning! Note that the limit
            setting is currently ignored.
          items:
            $ref: "#/components/schemas/InputMonitorConfigurationMetric_groupByFields_inner"
          maxItems: 1
          type: array
        aggregationAlertLogic:
          description: "How grouped results are combined into alert state. Use `no_aggregation`\
            \ only when `groupByFields` is empty; use `all`, `any`, `each`, or `proportion`\
            \ with non-empty `groupByFields`. `proportion` also requires `proportionAlertThreshold`.\
            \ On create, omitted query-monitor values default to `no_aggregation`;\
            \ on update, omitted values keep the existing aggregation logic."
          enum:
          - no_aggregation
          - all
          - any
          - each
          - proportion
          type: string
        proportionAlertThreshold:
          description: Percentage threshold used when `aggregationAlertLogic` is `proportion`.
            Valid values are 1 through 99.
          maximum: 99
          minimum: 1
          type: integer
        queries:
          description: "Aggregation queries used by alerting and SLO evaluation. Each\
            \ query is referenced from formulas as q1, q2, and so on."
          items:
            $ref: "#/components/schemas/MonitorAggregationQuery_1"
          maxItems: 15
          type: array
      required:
      - condition
      - groupByFields
      - noDataBehavior
      - queries
      - timeframe
      - type
