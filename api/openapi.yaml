openapi: 3.1.0
info:
  contact:
    name: Tsuga
    url: https://tsuga.com
  description: "Public HTTP API for Tsuga customers and customer-operated tools. Use\
    \ these endpoints to query observability data, manage customer-owned Tsuga resources,\
    \ and retrieve documentation or API-reference content. Public API requests authenticate\
    \ with Bearer tokens such as operation keys. See [API reference](/documentation/api)."
  title: Tsuga Public API
  version: 1.0.0
servers:
- url: https://api.tsuga.com
security:
- bearerAuth: []
tags:
- description: "Operations for aggregating logs, metrics, and traces. Use these endpoints\
    \ to compute scalar and timeseries results for analytics workflows. See [Analytics\
    \ queries](/documentation/visualize/analytics/queries)."
  name: aggregation
- description: "Operations for listing Tsuga clusters that hold observability data.\
    \ Use these endpoints to choose cluster scope for telemetry queries. See [Clusters](/documentation/account-and-settings/clusters)."
  name: clusters
- description: "Operations for custom telemetry tag keys tracked as usage dimensions.\
    \ Use these endpoints to configure which tags appear in usage analysis. See [Usage\
    \ overview](/documentation/account-and-settings/usage-overview)."
  name: custom-usage-tags
- description: "Operations for saved dashboards and dashboard graphs. Use these endpoints\
    \ to inventory, create, update, and delete reusable visualization definitions.\
    \ See [Dashboards](/documentation/visualize/dashboards/index)."
  name: dashboards
- description: "Operations for retrieving and searching Tsuga documentation and API-reference\
    \ content. Use these endpoints to power in-product help and documentation search.\
    \ See [Documentation](/documentation)."
  name: docs
- description: Operations for submitting feedback about Tsuga tools and APIs for Tsuga
    review.
  name: feedback
- description: "Operations for telemetry ingestion keys. Use these endpoints to create,\
    \ inspect, update, and delete keys used by collectors and direct telemetry senders.\
    \ See [API keys](/documentation/account-and-settings/api-keys)."
  name: ingestion-api-keys
- description: "Operations for cloud inventory resources. Use these endpoints to list\
    \ resources discovered from connected cloud accounts. See [Cloud resources](/documentation/categorize/cloud-resources)."
  name: inventory
- description: "Operations for organization invitations. Use these endpoints to invite\
    \ users and inspect invitation lifecycle state. See [How to invite members](/documentation/account-and-settings/guides/how-to-invite-members)."
  name: invitations
- description: "Operations for exploring Kubernetes workloads observed from telemetry:\
    \ pods, clusters, namespaces, deployments, StatefulSets, and DaemonSets, plus\
    \ pod and deployment details. Use these endpoints to inspect current workload\
    \ state and resource usage."
  name: kubernetes-explorer
- description: "Operations for searching log events, inspecting log attributes, and\
    \ analyzing recurring log patterns. See [Logs](/documentation/explore/logs)."
  name: logs
- description: "Operations for discovering metric names, retrieving metric metadata,\
    \ and querying metric data across telemetry sources. See [Metrics](/documentation/explore/metrics/index)."
  name: metrics
- description: "Operations for saved monitor definitions. Use these endpoints to create,\
    \ inspect, update, and delete alert evaluation rules, not notification delivery.\
    \ See [Monitors](/documentation/alert/monitors/index)."
  name: monitors
- description: "Operations for notification routing rules. Use these endpoints to\
    \ match alert transitions and send notifications to configured targets. See [Rules](/documentation/alert/notifications/rules)."
  name: notification-rules
- description: "Operations for notification silences. Use these endpoints to suppress\
    \ matching notification delivery during one-time or recurring windows. See [Silences](/documentation/alert/notifications/silences)."
  name: notification-silences
- description: "Operations for organization-level settings. Use these endpoints to\
    \ inspect or update account-wide configuration such as allowed email domains.\
    \ See [Domains and email login](/documentation/account-and-settings/authentication/domains-and-email-login)."
  name: organization
- description: Operations for PromQL metric queries. Use these endpoints when a client
    needs PromQL query syntax against Tsuga metric data.
  name: promql
- description: "Operations for telemetry quality report rows. Use these endpoints\
    \ to inspect rule outcomes and recommendations for teams or clusters. See [Quality\
    \ reports](/documentation/account-and-settings/quality-reports)."
  name: quality-reports
- description: Folders for organizing dashboards into a two-level hierarchy.
  name: dashboard-folders
- description: "Operations for retention policy rows for logs, metrics, and traces.\
    \ Use these endpoints to inspect or manage signal retention by scope. See [Retention](/documentation/account-and-settings/retention)."
  name: retention-policies
- description: "Operations for log routes and route processors. Use these endpoints\
    \ to manage ingest-time log processing definitions. See [Routes](/documentation/process/routes/index)."
  name: routes
- description: "Operations for services inferred from telemetry. Use these endpoints\
    \ to inspect service metadata, activity, and dependency graphs. See [Services](/documentation/categorize/services/index)."
  name: services
- description: "Operations for tag policies applied to Tsuga-managed assets or telemetry\
    \ data. Use these endpoints to configure required tags and allowed values. See\
    \ [Tag policies](/documentation/account-and-settings/tag-policies)."
  name: tag-policies
- description: "Operations for creating and managing teams used for ownership, collaboration,\
    \ and access control. See [Teams](/documentation/account-and-settings/teams)."
  name: teams
- description: "Operations for team membership assignments. Use these endpoints to\
    \ add, remove, and update users' roles in teams. See [Members](/documentation/account-and-settings/members)."
  name: team-memberships
- description: "Operations for searching distributed traces and inspecting trace spans\
    \ across services. See [Traces](/documentation/explore/traces)."
  name: traces
- description: "Operations for organization users. Use these endpoints to list users\
    \ and resolve user IDs, roles, and display metadata. See [Members](/documentation/account-and-settings/members)."
  name: users
paths:
  /v1/dashboards/query:
    post:
      description: "Queries dashboards visible to the authenticated operation key.\
        \ Use this endpoint to build dashboard inventories or synchronize dashboard\
        \ metadata. Pagination fields limit the returned page; use the response metadata\
        \ to request additional pages. See [Dashboards](/documentation/visualize/dashboards/index)."
      operationId: queryDashboards
      requestBody:
        content:
          application/json:
            example:
              filters:
                owners:
                  values:
                  - team-123-abc
                searchQuery:
                  value: API
                tags:
                  values:
                  - key: service
                    value: api-gateway
              sort:
                by: name
                direction: asc
              limit: 10
              offset: 0
            schema:
              $ref: "#/components/schemas/queryDashboards_request"
        description: "Dashboard query request. Use filters, sorting, limit, and offset\
          \ to page through visible dashboards."
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryDashboardsResponse"
          description: Successful response
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientErrorEnvelope"
          description: Client error
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorEnvelope"
          description: Server error
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
      tags:
      - dashboards
  /v1/dashboards/{id}:
    delete:
      description: Deletes a dashboard by ID. Use only after confirming no users or
        automation still rely on the dashboard.
      operationId: deleteDashboard
      parameters:
      - description: "Identifier of the saved dashboard to delete. Use the `id` returned\
          \ by dashboard query, get, create, or update responses."
        explode: false
        in: path
        name: id
        required: true
        schema:
          maxLength: 250
          minLength: 1
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteDashboardResponse"
          description: Successful response
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientErrorEnvelope"
          description: Client error
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorEnvelope"
          description: Server error
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
      tags:
      - dashboards
    get:
      description: Retrieves one dashboard by ID when the authenticated operation
        key can read it. Use this before updating or cloning a dashboard definition.
      operationId: getDashboard
      parameters:
      - description: "Identifier of the saved dashboard to retrieve. Use the `id`\
          \ returned by dashboard query, create, or update responses."
        explode: false
        in: path
        name: id
        required: true
        schema:
          maxLength: 250
          minLength: 1
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetDashboardResponse"
          description: Successful response
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientErrorEnvelope"
          description: Client error
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorEnvelope"
          description: Server error
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
      tags:
      - dashboards
    put:
      description: Updates an existing dashboard by ID. Fields are patched from the
        request body; omitted fields keep their current values.
      operationId: updateDashboard
      parameters:
      - description: "Identifier of the saved dashboard to update. Use the `id` returned\
          \ by dashboard query, get, or create responses."
        explode: false
        in: path
        name: id
        required: true
        schema:
          maxLength: 250
          minLength: 1
          nullable: true
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/updateDashboard_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateDashboardResponse"
          description: Successful response
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientErrorEnvelope"
          description: Client error
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorEnvelope"
          description: Server error
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
      tags:
      - dashboards
  /v1/dashboards:
    post:
      description: Creates a dashboard owned by the specified team. Use this to provision
        dashboards from automation or templates. The response returns the saved dashboard
        definition.
      operationId: createDashboard
      requestBody:
        content:
          application/json:
            example:
              name: API Performance Overview
              owner: team-123-abc
              graphs:
              - id: 789-abc-def
                name: Request Latency P99
                visualization:
                  type: timeseries
                  source: metrics
                  queries:
                  - aggregate:
                      type: percentile
                      field: duration
                      percentile: 99
                    filter: service:api-gateway
                layout:
                  x: 0
                  "y": 0
                  w: 6
                  h: 4
              filters:
              - key: env
                values:
                - production
              tags:
              - key: team
                value: platform
              timePreset: past-1-hour
              folderId: null
            schema:
              $ref: "#/components/schemas/createDashboard_request"
        description: "Dashboard create or update request. Provide the dashboard identity,\
          \ owner team, widgets, filters, tags, and optional time preset."
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDashboardResponse"
          description: Successful response
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientErrorEnvelope"
          description: Client error
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorEnvelope"
          description: Server error
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
      tags:
      - dashboards
  /v1/dashboards/{id}/graphs/{graphId}:
    put:
      description: Updates one graph inside a dashboard without replacing the full
        dashboard. Use this for targeted widget edits when you already know the dashboard
        ID and graph ID.
      operationId: updateDashboardGraph
      parameters:
      - description: Identifier of the dashboard that contains the graph to update.
          Use the `id` returned by dashboard responses.
        explode: false
        in: path
        name: id
        required: true
        schema:
          maxLength: 250
          minLength: 1
          nullable: true
          type: string
        style: simple
      - description: Identifier of the graph to update within the dashboard. Use graph
          IDs from the dashboard response.
        explode: false
        in: path
        name: graphId
        required: true
        schema:
          maxLength: 250
          minLength: 1
          nullable: true
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/updateDashboardGraph_request"
        description: Dashboard graph update request. The graph identifier is supplied
          in the `graphId` path parameter; provide the replacement graph definition
          without an `id` field.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateDashboardGraphResponse"
          description: Successful response
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientErrorEnvelope"
          description: Client error
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorEnvelope"
          description: Server error
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
      tags:
      - dashboards
  /v1/monitors/query:
    post:
      description: "Queries monitors visible to the authenticated operation key. Use\
        \ this endpoint to inventory monitor definitions, filter by owner, tag, priority,\
        \ type, activity, or cluster, and page through results. See [Monitors](/documentation/alert/monitors/index)."
      operationId: queryMonitors
      requestBody:
        content:
          application/json:
            example:
              filters:
                owners:
                  values:
                  - team-123-abc
                searchQuery:
                  value: service:api-gateway
                tags:
                  values:
                  - key: paging
                    value: "true"
                priorities:
                  values:
                  - 4
                  - 5
                  exclude: true
              sort:
                by: name
                direction: asc
              limit: 10
              offset: 0
            schema:
              $ref: "#/components/schemas/queryMonitors_request"
        description: "Monitor query request. Use filters, sorting, limit, and offset\
          \ to page through visible monitors."
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryMonitorsResponse"
          description: Successful response
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientErrorEnvelope"
          description: Client error
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorEnvelope"
          description: Server error
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
      tags:
      - monitors
  /v1/monitors/{id}:
    delete:
      description: Deletes a monitor by ID. Deleting a monitor stops future evaluations
        and alert transitions for that monitor.
      operationId: deleteMonitor
      parameters:
      - description: "Identifier of the saved monitor to delete. Use the `id` returned\
          \ by monitor query, create, or update responses."
        explode: false
        in: path
        name: id
        required: true
        schema:
          maxLength: 250
          minLength: 1
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteMonitorResponse"
          description: Successful response
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientErrorEnvelope"
          description: Client error
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorEnvelope"
          description: Server error
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
      tags:
      - monitors
    get:
      description: "Retrieves one monitor definition by ID when the authenticated\
        \ operation key can read it. Use this before updating, duplicating, or auditing\
        \ a monitor."
      operationId: getMonitor
      parameters:
      - description: "Monitor ID returned by monitor query, create, or update operations."
        explode: false
        in: path
        name: id
        required: true
        schema:
          maxLength: 250
          minLength: 1
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMonitorResponse"
          description: Successful response
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientErrorEnvelope"
          description: Client error
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorEnvelope"
          description: Server error
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
      tags:
      - monitors
    put:
      description: "Updates an existing monitor definition by ID. Required fields\
        \ and the submitted configuration are overwritten; omitted `message`, `tags`,\
        \ and `clusterIds` keep their existing values. Omitting `dashboardId` clears\
        \ the dashboard link, and public updates clear any existing snooze because\
        \ `pauseUntil` is not part of the public schema."
      operationId: updateMonitor
      parameters:
      - description: Identifier of the saved monitor to update. Use the `id` returned
          by monitor query or create responses.
        explode: false
        in: path
        name: id
        required: true
        schema:
          maxLength: 250
          minLength: 1
          nullable: true
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            examples:
              example1:
                value:
                  name: High Error Rate Alert
                  message: Error rate exceeded threshold. Check the API gateway logs.
                  tags:
                  - key: severity
                    value: critical
                  configuration:
                    type: log
                    timeframe: 5
                    groupByFields: []
                    aggregationAlertLogic: no_aggregation
                    queries:
                    - aggregate:
                        type: count
                      filter: level:ERROR service:api-gateway
                    conditions:
                    - formula: q1
                      operator: greater_than
                      threshold: 100
                    noDataBehavior: resolve
                  priority: 1
                  owner: team-123-abc
                  dashboardId: 789-abc-def
                  permissions: all
                  clusterIds: []
              example2:
                value:
                  name: High CPU Utilization By Service
                  message: More than half of grouped services are above the CPU threshold.
                  tags:
                  - key: severity
                    value: warning
                  configuration:
                    type: metric
                    timeframe: 10
                    groupByFields:
                    - fields:
                      - context.service.name
                      limit: 10
                    aggregationAlertLogic: proportion
                    proportionAlertThreshold: 50
                    queries:
                    - aggregate:
                        type: average
                        field: system.cpu.utilization
                      filter: context.service.name:checkout
                    conditions:
                    - formula: q1
                      operator: greater_than
                      threshold: 0.8
                    noDataBehavior: keep_last_status
                  priority: 2
                  owner: team-123-abc
                  dashboardId: 789-abc-def
                  permissions: all
                  clusterIds: []
              example3:
                value:
                  name: Certificate Expiry Warning
                  message: A certificate is approaching expiry.
                  tags:
                  - key: environment
                    value: production
                  configuration:
                    type: certificate-expiry
                    warnBeforeInDays: 30
                    cloudAccounts:
                    - aws-prod
                    aggregationAlertLogic: each
                    noDataBehavior: resolve
                  priority: 3
                  owner: team-123-abc
                  dashboardId: 789-abc-def
                  permissions: all
                  clusterIds: []
              example4:
                value:
                  name: New Error Pattern Detector
                  message: A new error pattern was detected in the logs.
                  tags:
                  - key: team
                    value: platform
                  configuration:
                    type: log-error-pattern
                    aggregationAlertLogic: each
                    noDataBehavior: keep_last_status
                    filter:
                      teamIds:
                      - team-123-abc
                      env: production
                      service: api-gateway
                  priority: 2
                  owner: team-123-abc
                  dashboardId: 789-abc-def
                  permissions: all
                  clusterIds: []
            schema:
              $ref: "#/components/schemas/updateMonitor_request"
        description: "Monitor update request. Required fields and the submitted configuration\
          \ are overwritten; omitted `message`, `tags`, and `clusterIds` keep their\
          \ existing values. Omitting `dashboardId` clears the dashboard link."
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateMonitorResponse"
          description: Successful response
          headers:
            x-request-id:
              description: "Unique identifier for this API request, useful for debugging\
                \ and support"
              explode: false
              schema:
                type: string
              style: simple
        "4XX":
          content:
