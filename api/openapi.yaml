    Rule:
      description: "Notification rule that matches alert transitions and routes notifications\
        \ to one or more targets. See [Rules](/documentation/alert/notifications/rules)."
      example:
        id: 123-456-abc
        name: Critical Alerts
        queryString: env:prod service:api
